<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/resource/favicon.png">
	<title>WebMessenger Облачко</title>
	<link rel="stylesheet" href="/resource/css/style.css">
</head>
<body>
	<script>
		let userName = localStorage.getItem("userName");
		if (!userName) {
			window.location.href ='/login';
		}
	</script>
	<!-- Боковая панель -->
	<div class="sidebar">
		<div class="sidebar-header">
			<h2>WebMessenger Облачко</h2>
			<p id="userName">НИК</p>
		</div>
		
		<div class="search">
			<input id="searchInput" maxlength="100" type="text" placeholder="Найти пользователя"/>
			<button id="searchButton">🔍</button>
		</div>

		<nav class="sidebar-menu">
			<ul id="chatList"></ul>
		</nav>
		
		<div class="sidebar-footer">
			<button id="logoutButton">Выйти из аккаунта</button>
		</div>
	</div>

	<!-- Основной контент -->
	<div class="container-main">
		<header>
			<button id="burger-menu">☰</button>
			<h1 id="chat-title"></h1>
		</header>
		<main class="main-content">
			<ul id="messages"></ul>
			<div class="message-input-container">
				<input id="messageInput" maxlength="1024" type="text" placeholder="Type message here and press Enter"/>
				<button id="sendMessageButton">Отправить</button>
			</div>
		</main>
		<div id="notification-container"></div>
	</div>
	<script src="/resource/js/script.js"></script>
	<script src="/resource/js/loadPages.js"></script>
</body>
</html>
